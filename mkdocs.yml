site_name: godolt
site_description: Dolt operational surface for Go programs — SQL-wire first, dolt CLI for the cold path
site_url: https://grokify.github.io/godolt
repo_name: grokify/godolt
repo_url: https://github.com/grokify/godolt

theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Releases:
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
